<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05030a">
<title>Hollow Stars — a card game of cosmic dread</title>
<style>:root{--uw:58px;--uh:78px;--hw:100px;--hh:140px;--side:180px;--serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--bone:#d8ccb0;--bronze:#7a6040;--ink:#e8e0d4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#010102;color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#vig{position:fixed;inset:0;z-index:56;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,#000a 85%,#000e)}
#grain{position:fixed;left:-50%;top:-50%;width:200%;height:200%;z-index:57;pointer-events:none;opacity:.55;animation:grain .9s steps(5) infinite;will-change:transform}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-4%,-1%)}80%{transform:translate(3%,3%)}}
.screen{position:fixed;inset:0;display:none;z-index:1;flex-direction:column;align-items:center}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{position:relative;padding:.8em 1.7em;border-radius:3px;font-family:var(--serif);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13.5px;color:#f0e2cc;background:linear-gradient(180deg,#2a0c12,#0c0306 60%,#170408);box-shadow:0 0 0 1px #000 inset,0 0 0 2px #8a6a44 inset,0 0 0 3px #1a0e06 inset,0 0 22px #a0102066,0 6px 14px #000c;text-shadow:0 0 10px #ff4a3a88,0 1px 0 #000;transition:transform .12s,filter .2s}
.btn::before,.btn::after{content:"";position:absolute;top:50%;width:6px;height:6px;background:#c8a070;transform:translateY(-50%) rotate(45deg);box-shadow:0 0 6px #ff8a3a}
.btn::before{left:7px}.btn::after{right:7px}
.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.25)}
.btn.ghost{background:linear-gradient(180deg,#141216,#050406);box-shadow:0 0 0 1px #000 inset,0 0 0 2px #4a4038 inset,0 6px 14px #000c;text-shadow:0 1px 0 #000}
.btn.ghost::before,.btn.ghost::after{background:#5a5048;box-shadow:none}
.btn.sm{padding:.5em 1em;font-size:11.5px;letter-spacing:.1em}.btn.sm::before,.btn.sm::after{display:none}
.btn[disabled]{opacity:.38;filter:grayscale(1)}
#mute{position:fixed;top:max(6px,env(safe-area-inset-top));right:6px;z-index:60;width:34px;height:34px;border-radius:50%;background:#070507e6;box-shadow:0 0 0 1px #4a4038 inset;display:grid;place-items:center}
#mute svg{width:18px;height:18px;fill:#c8b8a0}
/* title */
#title{justify-content:center}
#teye{position:absolute;left:50%;top:31%;transform:translate(-50%,-50%);pointer-events:none}
.tbox{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:38vh}
body.land .tbox{margin-top:36vh}body.land #teye{top:25%}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,11vw,92px);letter-spacing:.2em;margin-right:-.2em;line-height:.95;color:#e8dccb;text-shadow:0 0 2px #fff8,0 0 18px #a01828,0 0 46px #5a0a40;animation:flick 7s infinite}
h1 span{display:block;font-size:.5em;letter-spacing:.8em;margin-right:-.8em;color:#a89880;text-shadow:0 0 14px #4affc066}
@keyframes flick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.35}43%{opacity:.95}44%{opacity:.5}46%{opacity:1}78%{opacity:1}78.6%{opacity:.6}79.2%{opacity:1}}
body.land h1{font-size:clamp(34px,8vh,92px)}
.sub{font-family:var(--serif);font-style:italic;color:#8a7c6c;letter-spacing:.2em;font-size:13px}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:16px;width:min(78vw,300px)}
body.land .menu{flex-direction:row;width:auto;margin-top:6px}
h2{font-family:var(--serif);font-weight:400;letter-spacing:.24em;color:#e0d2bc;text-shadow:0 0 14px #a0102a;font-size:21px;text-align:center;margin:10px 0}
h3{font-family:var(--serif);font-weight:400;letter-spacing:.2em;color:#9a8c78;font-size:13px;text-align:center;margin:16px 0 8px}
.scroll{width:100%;height:100%;overflow-y:auto;touch-action:pan-y;padding:max(14px,env(safe-area-inset-top)) 14px 24px;display:flex;flex-direction:column;align-items:center}
.orn{width:min(70%,320px);height:10px;margin:-2px auto 8px;background:linear-gradient(90deg,transparent,#8a6a44 30%,#8a6a44 70%,transparent) center/100% 1px no-repeat;position:relative}
.orn::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:#c8a070;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 8px #ff6a3a}
/* pick */
.tiles{display:grid;grid-template-columns:1fr;gap:10px;width:min(100%,560px)}
body.land .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));width:min(100%,960px)}
.tile{display:flex;gap:12px;align-items:center;padding:10px;border-radius:4px;background:var(--fr) center/cover;box-shadow:0 0 0 1px #000 inset,0 0 0 2px #3a3028 inset,0 6px 14px #000c;opacity:.7;transition:.2s;text-align:left;position:relative}
body.land .tile{flex-direction:column;text-align:center}
.tile.on{opacity:1;box-shadow:0 0 0 1px #000 inset,0 0 0 2px var(--f2) inset,0 0 26px var(--glow)}
.tile .ta{filter:brightness(1.35);width:76px;height:76px;border-radius:50%;background-size:cover;flex:none;box-shadow:0 0 0 2px #000,0 0 0 4px var(--f3),0 0 14px var(--glow)}
.tile b{font-family:var(--serif);font-size:16px;letter-spacing:.1em;display:block;color:#f0e4d0}
.tile small{color:#a89c8c;font-size:12px;line-height:1.35;display:block;margin-top:3px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button,.bfil button{padding:.45em .95em;border-radius:2px;background:#0a0809;box-shadow:0 0 0 1px #3a3028 inset;font-size:12.5px;color:#b8aa96;letter-spacing:.06em}
.seg button.on,.bfil button.on{background:#2a0a10;color:#f4e4cc;box-shadow:0 0 0 1px #c8a070 inset,0 0 12px #a0102a88}
.rowb{display:flex;gap:10px;margin-top:18px;justify-content:center}
/* how */
.how{max-width:640px;font-size:14px;line-height:1.55;color:#c8bcaa;background:#050405cc;padding:12px 16px;box-shadow:0 0 0 1px #2a2420 inset}
.how p,.how li{margin:7px 0}.how ul{padding-left:18px}.how b{color:#f0e2cc}.how i{color:#c8a070}
.how .kwl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:8px 0}
.ki{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#120a0c;box-shadow:0 0 0 1px #8a6a44 inset}
.ki svg{width:13px;height:13px;fill:#f0e0c8}
.demo{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.demo .atk,.demo .hp,.demo .cost{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;font-size:14px}
/* ---------- CARD ---------- */
.f-v{--f0:#07030a;--f1:#1e0c2c;--f2:#8a6ab0;--f3:#4a3460;--glow:#6a2aa8;--acc:#4affc0;--fr:var(--fr-v)}
.f-m{--f0:#030505;--f1:#151c1e;--f2:#7aa8a8;--f3:#3a4446;--glow:#1a8890;--acc:#ff8a26;--fr:var(--fr-m)}
.f-c{--f0:#080102;--f1:#2a070c;--f2:#b85a50;--f3:#5a2a20;--glow:#a0101e;--acc:#c8f050;--fr:var(--fr-c)}
.f-n{--f0:#050506;--f1:#1a1c1e;--f2:#a89a78;--f3:#4a4436;--glow:#8a7040;--acc:#ffb04a;--fr:var(--fr-n)}
.card{--cw:var(--hw);container-type:inline-size;position:relative;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.06);font-size:calc(var(--cw)*.072);background:var(--fr) center/cover,#050405;box-shadow:0 0 0 calc(var(--cw)*.008) #000,0 0 0 calc(var(--cw)*.018) var(--f3),0 .5em 1.2em #000e;color:var(--ink);flex:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(128deg,#ffffff14,transparent 28%,transparent 72%,#ffffff08);box-shadow:0 0 0 calc(var(--cw)*.022) #0008 inset}
.card.f-m{border-radius:calc(var(--cw)*.025)}
.card .art{position:absolute;left:7.5%;right:7.5%;top:5.5%;height:44%;background-size:cover;background-position:center;border-radius:.25em;box-shadow:0 0 0 1px #000,0 0 0 .22em var(--f3),0 0 0 .3em #000,0 0 1.2em #000 inset}
.card.f-v .art{border-radius:46% 46% .4em .4em/22% 22% .4em .4em}
.card.f-c .art{clip-path:polygon(0 6%,6% 0,94% 0,100% 6%,100% 94%,94% 100%,6% 100%,0 94%);border-radius:0}
.card.f-m .art{clip-path:polygon(0 0,100% 0,100% 88%,92% 100%,0 100%)}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,#000a);border-radius:inherit}
.cost{position:absolute;left:-1%;top:-1.5%;width:2.95em;height:3.4em;z-index:3;display:grid;place-items:center}
.cost::before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle,#8a3affb0,transparent 60%);pointer-events:none;animation:cg 3s ease-in-out infinite}
@keyframes cg{50%{opacity:.55}}
.cost .cr{position:absolute;inset:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:radial-gradient(circle at 50% 55%,#b070ff 0,#4a1890 28%,#12052a 62%,#05010c);overflow:hidden}
.cost .cr::before{content:"";position:absolute;inset:4%;clip-path:inherit;background:conic-gradient(from 0deg,#4affc0aa,#1a0630,#d060ffcc,#05010a,#4a8affaa,#1a0630,#4affc0aa);animation:swirl 9s linear infinite;mix-blend-mode:screen}
.cost .cr::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,#ffffff50 0 18%,transparent 19% 52%,#ffffff18 53% 60%,transparent 61%),linear-gradient(0deg,#000a,transparent 40%);clip-path:inherit}
@keyframes swirl{to{transform:rotate(360deg)}}
.cost b{position:relative;font-weight:900;font-size:1.45em;color:#fff;text-shadow:0 0 .3em #c890ff,0 0 .15em #000,0 .06em 0 #000}
.card .nm{position:absolute;top:50.3%;left:4%;right:4%;height:1.85em;display:flex;align-items:center;justify-content:center;z-index:2;background:linear-gradient(180deg,#1a1416,#060405);box-shadow:0 0 0 1px #000,0 0 0 .14em var(--f3) inset,0 .2em .4em #000c;clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%)}
.card .nm span{font-family:var(--serif);font-weight:700;font-size:1.12em;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;color:#f2e6d2;text-shadow:0 0 .5em var(--glow),0 1px 0 #000}
.card .ty{position:absolute;top:60.2%;left:9%;right:9%;height:1.4em;display:flex;align-items:center;gap:.35em;font-size:.72em;letter-spacing:.2em;text-transform:uppercase;color:var(--f2);z-index:2}
.card .ty svg{width:1.35em;height:1.35em;fill:var(--f2);flex:none;filter:drop-shadow(0 0 .2em var(--glow))}
.card .ty span{flex:1;white-space:nowrap;overflow:hidden}
.gem{width:.95em;height:.95em;flex:none;transform:rotate(45deg);box-shadow:0 0 0 .12em #000,0 0 .5em var(--g);background:radial-gradient(circle at 30% 30%,#fff8,transparent 40%),var(--g)}
.r-C{--g:#7a8088}.r-U{--g:#3a9ad0}.r-R{--g:#d8a030}.r-L{--g:#c040e0}.r-T{--g:#444}
.r-L .gem{background:conic-gradient(#ff4de0,#5a8aff,#4affc0,#ffd050,#ff4de0);animation:gemspin 3s linear infinite}
@keyframes gemspin{to{transform:rotate(405deg)}}
.card .tx{position:absolute;top:65.6%;left:8%;right:8%;bottom:10%;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.25em;text-align:center;padding:.3em .5em;background:linear-gradient(180deg,#0c0a0be8,#050405f0);box-shadow:0 0 0 1px #000,0 0 0 .12em #2a2420 inset;z-index:1;overflow:hidden}
.card .rt{font-size:.9em;line-height:1.2;color:#ece2d2}
.card .rt b{color:#fff;font-weight:800}
.card .fl{font-family:var(--serif);font-style:italic;font-size:.72em;line-height:1.2;color:#8a7e6e}
.card.spell .tx{bottom:6%}
.card.long .fl{display:none}
@container (max-width:150px){.card .fl{display:none}.card .rt{font-size:1.2em;line-height:1.1}.card.long .rt{font-size:1.02em;line-height:1.08}.card .tx{padding:.15em .3em;left:5%;right:5%}.card .ty{font-size:.78em;letter-spacing:.1em}}
/* stats */
.atk,.hp{position:absolute;bottom:-1.5%;width:3.2em;height:3.4em;z-index:4;display:grid;place-items:center}
.atk{left:-2%}.hp{right:-2%}
.atk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.atk b,.hp b{position:relative;font-weight:900;font-size:1.42em;color:#fff;text-shadow:0 0 .2em #000,0 0 .2em #000,0 .07em 0 #000}
.atk b{top:.38em}
.atk.up b{color:#c8ff9a}
.hp::before{content:"";position:absolute;left:3%;right:3%;top:-3%;bottom:0;clip-path:var(--drop);background:linear-gradient(160deg,#f0b0a0,#5a0a12 45%,#0a0002)}
.hp .drop{position:absolute;left:8%;right:8%;top:2%;bottom:2%;clip-path:var(--drop);background:radial-gradient(circle at 40% 70%,#2a0a0c,#0a0203);overflow:hidden}
.hp .drop::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 34% 58%,#ffffff70 0 6%,transparent 14%),linear-gradient(90deg,#0008,transparent 30%,transparent 70%,#000a)}
.hp .fill{position:absolute;left:0;right:0;bottom:0;height:var(--p,100%);background:linear-gradient(180deg,#d01828,#7a0410 55%,#3a0006);transition:height .8s cubic-bezier(.3,.8,.3,1)}
.hp .fill::before{content:"";position:absolute;left:-10%;right:-10%;top:-.18em;height:.4em;border-radius:50%;background:#ff4a50;opacity:.75}
.hp b{top:.42em}
.hp.hurt b{color:#ffc8c8}
.hp .drip{position:absolute;left:50%;bottom:-.1em;width:.45em;height:.6em;margin-left:-.22em;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#a00818;opacity:0;pointer-events:none}
.hp.drain .fill::before{animation:wob .8s ease-out}
.hp.drain .drip{animation:drip 1s ease-in forwards}
.hp.drain .drop{animation:pulse .5s}
@keyframes wob{0%{transform:translateY(-.25em) scaleY(2.2)}35%{transform:translateY(.12em) scaleY(.6)}70%{transform:translateY(-.06em) scaleY(1.3)}}
@keyframes drip{0%{opacity:0;transform:translateY(-.3em) scale(.4)}20%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(1.8em) scale(.7)}}
@keyframes pulse{40%{filter:brightness(2.2)}}
.cnt{position:absolute;top:5%;right:6%;z-index:5;font-weight:800;font-size:1.25em;padding:.1em .45em;background:#000d;box-shadow:0 0 0 1px var(--f2) inset;border-radius:2px}
.cnt.full{color:#ffc860}
/* ---------- MATCH ---------- */
#match{display:none;width:100%;max-width:100vw;overflow:hidden;height:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);grid-template-columns:1fr;grid-template-rows:auto 1fr auto 1fr auto auto;grid-template-areas:"oh" "ob" "mid" "mb" "mh" "hand"}
#match.on{display:grid}
body.land #match{grid-template-columns:var(--side) 1fr;grid-template-rows:1fr 1fr auto;grid-template-areas:"oh ob" "mid mb" "mh hand"}
#oph{grid-area:oh}#opb{grid-area:ob}#mid{grid-area:mid}#myb{grid-area:mb}#myh{grid-area:mh}#hand{grid-area:hand}
.board{display:flex;justify-content:center;align-items:center;gap:calc(var(--uw)*.07);min-height:calc(var(--uh) + 16px);padding:8px 4px;position:relative}
.board::before{content:"";position:absolute;left:2%;right:2%;top:50%;height:calc(var(--uh)*1.18);transform:translateY(-50%);background:var(--lane) center/100% 100% no-repeat;pointer-events:none;opacity:.9}
#myb.drop::before{filter:brightness(2.2) sepia(1) hue-rotate(-30deg)}
body.land #opb{padding-right:44px}
.unit{position:relative;width:var(--uw);height:var(--uh);flex:none;font-size:calc(var(--uw)*.16);background:var(--fr) center/cover,#050405;border-radius:6%;box-shadow:0 0 0 1px #000,0 0 0 2.5px var(--f3),0 5px 12px #000e;transition:box-shadow .2s,translate .2s,opacity .3s;cursor:pointer}
.unit .art{filter:brightness(1.22) contrast(1.06);overflow:hidden;position:absolute;inset:7% 8% 9%;border-radius:4%;background-size:cover;background-position:center;box-shadow:0 0 0 1px #000,0 0 .6em #000 inset}
.unit.f-v .art{border-radius:40% 40% 6% 6%/20% 20% 6% 6%}
.unit .atk,.unit .hp{bottom:-.85em;width:2.55em;height:2.75em}
.unit .atk{left:-.55em}.unit .hp{right:-.55em}
.unit .atk b,.unit .hp b{font-size:1.25em}
.unit .kws{position:absolute;top:4%;right:4%;display:flex;flex-direction:column;gap:2px;z-index:2}
.unit .kws svg{width:1.15em;height:1.15em;padding:.14em;border-radius:50%;background:#000d;fill:#e8dcc8;box-shadow:0 0 0 1px #8a6a44}
.unit.guard{box-shadow:0 0 0 1px #000,0 0 0 3px #8a6a3a,0 0 0 4px #000,0 0 0 calc(4px + var(--uw)*.035) #c89a4a,0 5px 12px #000e;border-radius:10% 10% 36% 36%/8% 8% 20% 20%}
.unit.guard .art{border-radius:8% 8% 34% 34%/6% 6% 18% 18%}
.unit.phase .art{animation:phase 3s ease-in-out infinite}
@keyframes phase{50%{opacity:.5}}
.unit.sleep .art{filter:saturate(.35) brightness(.75)}
.unit.sleep::after{content:"z z";position:absolute;top:-2px;left:8%;font-size:.85em;font-weight:800;color:#9ab0c8;text-shadow:0 0 4px #000;letter-spacing:.1em;z-index:3}
.unit.ready{box-shadow:0 0 0 1px #000,0 0 0 2.5px #c8f0a0,0 0 16px #6aff9a99,0 5px 12px #000e}
.unit.guard.ready{box-shadow:0 0 0 1px #000,0 0 0 3px #8a6a3a,0 0 0 4px #000,0 0 0 calc(4px + var(--uw)*.035) #c8f0a0,0 0 18px #6aff9a99,0 5px 12px #000e}
.unit.sel{translate:0 -8px;box-shadow:0 0 0 1px #000,0 0 0 3px #fff4dc,0 0 26px var(--glow),0 8px 16px #000e}
.unit.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{transform:scale(1.7) translateY(-20%);opacity:0}}
.unit.dying{animation:dissolve .75s ease-in forwards;pointer-events:none}
@keyframes dissolve{30%{filter:brightness(2.2) saturate(0)}to{opacity:0;filter:brightness(3) saturate(0);transform:scale(.55) rotate(10deg) translateY(-20%)}}
.unit.hit,.hero.hit{animation:hit .35s}
@keyframes hit{25%{transform:translateX(-4px);filter:brightness(1.8) sepia(1) hue-rotate(-50deg) saturate(4)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.tgt{outline:2px dashed #ff4a5a;outline-offset:3px;animation:tg 1s ease-in-out infinite}
@keyframes tg{50%{outline-color:#ffc8c0;outline-offset:6px}}
.ftgt{outline-color:#9cffb0!important}
#match.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
/* heroes */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;min-width:0;grid-template-areas:"av nm st" "av md st";gap:3px 10px;align-items:center;padding:6px 10px 6px 8px;margin:4px 6px;border-radius:3px;background:linear-gradient(90deg,#000c,#0008),var(--fr) center/cover;box-shadow:0 0 0 1px #000,0 0 0 2px var(--f3),0 6px 14px #000c;position:relative;transition:box-shadow .3s}
#oph{margin-right:46px}body.land #oph{margin-right:6px}
.hero.act{box-shadow:0 0 0 1px #000,0 0 0 2px var(--f2),0 0 22px var(--glow)}
body.land .hero{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"av nm" "av md" "st st";align-self:center;padding:6px 8px}
.hero .av{filter:brightness(1.45) contrast(1.1);grid-area:av;width:48px;height:48px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #000,0 0 0 4px var(--f3),0 0 0 5px #000,0 0 16px var(--glow)}
.hero .hn{grid-area:nm;font-family:var(--serif);font-size:13px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eadcc6}
.hero .md{grid-area:md;display:flex;gap:2px;align-items:center}
.hero .md i{width:9px;height:6px;border-radius:50%/50%;background:#140c14;box-shadow:0 0 0 1px #3a2a3a inset}

function cardText(d){const k=d.k.filter(k=>k!=='offering'||!/Offering/.test(d.x)).map(k=>k==='dread'?'Dread '+d.dread:KW[k][0]).join(', ');return(k?`<b>${k}.</b> `:'')+(d.x||'').replace(/^Offering:/,'<b>Offering:</b>')}
function prebuilt(f){const cards=[];for(const id of COL){const d=C[id];if(d.f!==f)continue;cards.push(id);if(d.r!=='L')cards.push(id)}cards.push('n2','n2','n3','n3','n4');return{fac:f,name:FAC[f].hero,cards}}
/* ================= RULES ================= */
function fx(g,o){if(!g.sim)g.fx.push(o)}
function units(g){return g.p[0].board.concat(g.p[1].board)}
function findU(g,uid){for(const p of g.p)for(const u of p.board)if(u.uid===uid)return u}
function resolve(g,t){if(!t)return null;if(t[0]==='h')return{k:'h',pi:+t[1]};const u=findU(g,+t.slice(1));return u?{k:'u',pi:u.o,u}:null}
function addMad(g,pi,n){const p=g.p[pi],b=p.mad;p.mad=Math.max(0,Math.min(10,p.mad+n));if(p.mad!==b)fx(g,{k:'mad',pi,n:p.mad-b})}
function healH(g,pi,n){const p=g.p[pi],b=p.san;p.san=Math.min(20,p.san+n);if(p.san>b)fx(g,{k:'heal',id:'h'+pi,n:p.san-b})}
function hurtH(g,pi,n,src){if(n<=0)return;g.p[pi].san-=n;fx(g,{k:'dmg',id:'h'+pi,n});if(src&&src.k.includes('drain'))healH(g,src.o,n)}
function hurtU(g,u,n,src){if(n<=0||u.dead)return;u.h-=n;fx(g,{k:'dmg',id:'u'+u.uid,n});if(src){if(src.k.includes('blight')&&u.h>0){u.h=0;fx(g,{k:'blight',id:'u'+u.uid})}if(src.k.includes('drain'))healH(g,src.o,n)}}
function hurt(g,T,n,src){if(T.k==='h')hurtH(g,T.pi,n,src);else hurtU(g,T.u,n,src)}
function destroy(g,u){u.h=0;u.dead=1}
function buff(u,a,h){u.a+=a;u.h+=h;u.mh+=h}
function draw(g,pi,n=1){const p=g.p[pi];for(let i=0;i<n;i++){if(!p.deck.length){p.fat++;fx(g,{k:'fatigue',pi,n:p.fat});hurtH(g,pi,p.fat);addMad(g,pi,1);continue}const id=p.deck.pop();if(p.hand.length>=10){fx(g,{k:'burn',pi,cid:id});continue}p.hand.push({uid:g.uid++,id});fx(g,{k:'draw',pi})}}
function mkUnit(g,pi,id,uid){const d=C[id];return{uid:uid??g.uid++,id,o:pi,a:d.a,h:d.h,mh:d.h,k:d.k.slice(),ready:d.k.includes('swift'),atk:0,dead:0}}
function summon(g,pi,id){const p=g.p[pi];if(p.board.length>=6)return null;const u=mkUnit(g,pi,id);p.board.push(u);fx(g,{k:'summon',id:'u'+u.uid});return u}
function sacrifice(g,pi,ex){const b=g.p[pi].board.filter(u=>u!==ex&&u.h>0);if(!b.length)return null;b.sort((x,y)=>(x.a+x.h)-(y.a+y.h));destroy(g,b[0]);fx(g,{k:'sac',id:'u'+b[0].uid});return b[0]}
function cleanup(g){for(let n=0;n<30;n++){let any=false;for(let pi=0;pi<2;pi++){const p=g.p[pi],dead=p.board.filter(u=>u.h<=0);if(!dead.length)continue;any=true;p.board=p.board.filter(u=>u.h>0);for(const u of dead){u.dead=1;fx(g,{k:'die',id:'u'+u.uid});if(u.k.includes('salvage'))draw(g,pi,1);const d=C[u.id];if(d.death)d.death(g,pi,u)}}if(!any)break}checkWin(g)}
function checkWin(g){if(g.over)return;const l=g.p.map(p=>p.san<=0||p.mad>=10);if(l[0]||l[1]){g.over=true;g.winner=l[0]&&l[1]?-1:l[0]?1:0;const lp=g.p[l[0]?0:1];g.reason=lp.mad>=10?'mad':'san'}}
function spellTargets(g,pi,tg){const r=[],add=pj=>{for(const u of g.p[pj].board)r.push('u'+u.uid)};
 if(tg==='unit'){add(0);add(1)}else if(tg==='enemyUnit')add(1-pi);else if(tg==='friendlyUnit')add(pi);else if(tg==='enemy'){add(1-pi);r.push('h'+(1-pi))}else if(tg==='any'){add(0);add(1);r.push('h0','h1')}return r}
function canAtk(u){return u.ready&&!u.atk&&u.a>0&&u.h>0}
function atkTargets(g,pi,u){const ph=u.k.includes('phase');const e=E(g,pi).board.filter(t=>ph||!t.k.includes('phase'));const gd=e.filter(t=>t.k.includes('guard'));if(!ph&&gd.length)return gd.map(t=>'u'+t.uid);return e.map(t=>'u'+t.uid).concat('h'+(1-pi))}
function canPlay(g,pi,c){const p=g.p[pi],d=C[c.id];if(g.over||g.cur!==pi||d.c>p.flux)return false;if(d.t==='u')return p.board.length<6;if(d.tg)return spellTargets(g,pi,d.tg).length>0;return true}
function play(g,pi,huid,tg){const p=g.p[pi],i=p.hand.findIndex(c=>c.uid===huid);if(i<0)return false;const c=p.hand[i],d=C[c.id];if(!canPlay(g,pi,c))return false;
 if(d.tg&&(!tg||!spellTargets(g,pi,d.tg).includes(tg)))return false;
 p.hand.splice(i,1);p.flux-=d.c;fx(g,{k:'play',pi,cid:c.id,tg,uid:c.uid});
 if(d.t==='u'){const u=mkUnit(g,pi,c.id,c.uid);p.board.push(u);if(d.dread)addMad(g,1-pi,d.dread);if(d.play)d.play(g,pi,u)}
 else{if(tg)fx(g,{k:'spellhit',id:tg,f:d.f});d.cast(g,pi,resolve(g,tg))}
 cleanup(g);return true}
function attack(g,pi,uid,tg){const u=g.p[pi].board.find(x=>x.uid===uid);if(!u||g.over||g.cur!==pi||!canAtk(u)||!atkTargets(g,pi,u).includes(tg))return false;const T=resolve(g,tg);u.atk=1;
 if(T.k==='h')hurtH(g,T.pi,u.a,u);else{const v=T.u,va=v.a;hurtU(g,v,u.a,u);hurtU(g,u,va,v)}
 cleanup(g);return true}
function startTurn(g){const pi=g.cur,p=g.p[pi];g.turn++;p.max=Math.min(10,p.max+1);p.flux=p.max;for(const u of p.board){u.ready=true;u.atk=0}
 fx(g,{k:'turn',pi});for(const u of p.board.slice()){const d=C[u.id];if(d.start&&u.h>0)d.start(g,pi,u)}
 if(g.turn>1)draw(g,pi,1);cleanup(g)}
function endTurn(g){if(g.over)return;const pi=g.cur;for(const u of g.p[pi].board.slice()){const d=C[u.id];if(d.end&&u.h>0)d.end(g,pi,u)}cleanup(g);if(g.over)return;g.cur=1-pi;
 if(g.turn>=120){g.over=true;const s=g.p.map(p=>p.san-p.mad);g.winner=s[0]===s[1]?-1:s[0]>s[1]?0:1;g.reason='time';return}startTurn(g)}
function newGame(d0,d1,o={}){const g={p:[],cur:0,turn:0,uid:1,fx:[],over:false,winner:null,sim:o.sim?1:0};
 [d0,d1].forEach((d,pi)=>g.p.push({fac:d.fac,name:d.name,deck:shuffle(d.cards.slice()),hand:[],board:[],san:20,mad:0,flux:0,max:0,fat:0,ai:!!(o.ai&&o.ai[pi])}));
 g.cur=o.first??(rnd()<.5?0:1);draw(g,0,5);draw(g,1,5);g.fx=[];startTurn(g);return g}
/* ================= AI ================= */
function legal(g,pi){const p=g.p[pi],A=[];if(g.over||g.cur!==pi)return A;
 for(const c of p.hand){const d=C[c.id];if(!canPlay(g,pi,c))continue;if(d.tg)for(const T of spellTargets(g,pi,d.tg))A.push({t:'play',uid:c.uid,tg:T});else A.push({t:'play',uid:c.uid})}
 for(const u of p.board)if(canAtk(u))for(const T of atkTargets(g,pi,u))A.push({t:'atk',uid:u.uid,tg:T});return A}
function act(g,pi,a){return a.t==='play'?play(g,pi,a.uid,a.tg):attack(g,pi,a.uid,a.tg)}
const cloneG=typeof structuredClone==='function'?g=>{const c=structuredClone(g);c.fx=[];c.sim=1;return c}:g=>{const c=JSON.parse(JSON.stringify(g));c.fx=[];c.sim=1;return c};
const sanV=s=>s<=0?-80:s-(s<12?(12-s)*(12-s)*.07:0);
const madV=m=>m*.7+m*m*.13;
const KWV={guard:.8,phase:1.1,blight:1.7,salvage:.9};
function unitV(u){const d=C[u.id];let v=1+u.a*1.1+Math.max(u.h,0)*.9;for(const k of u.k){v+=KWV[k]||0;if(k==='drain')v+=u.a*.4}if(d.start||d.end)v+=1.8;return v}
function evalS(g,pi){if(g.over)return g.winner===pi?1e6:g.winner===-1?-1e5:-1e6;const m=g.p[pi],o=g.p[1-pi];let s=sanV(m.san)-sanV(o.san)+madV(o.mad)-madV(m.mad);
 for(const u of m.board)s+=unitV(u);for(const u of o.board)s-=unitV(u);return s+Math.min(m.hand.length,8)*.9-Math.min(o.hand.length,8)*.9}
function aiChoose(g,pi){const A=legal(g,pi);if(!A.length)return null;const sr=rnd;let best=null,bv=evalS(g,pi)+.05;
 for(const a of A){const c=cloneG(g);act(c,pi,a);const v=evalS(c,pi)+(a.t==='atk'&&a.tg[0]==='h'?.02:0);if(v>bv){bv=v;best=a}}rnd=sr;return best}
function aiTurnSync(g){const pi=g.cur;for(let n=0;n<40&&!g.over;n++){const a=aiChoose(g,pi);if(!a)break;act(g,pi,a)}if(!g.over)endTurn(g)}
function simulate(f0,f1,first){const g=newGame(typeof f0==='string'?prebuilt(f0):f0,typeof f1==='string'?prebuilt(f1):f1,{ai:[1,1],sim:1,first});for(let n=0;n<300&&!g.over;n++)aiTurnSync(g);return{winner:g.winner,turns:g.turn,reason:g.reason,san:g.p.map(p=>p.san),mad:g.p.map(p=>p.mad),over:g.over}}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
