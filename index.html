<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05030a">
<title>Hollow Stars — a card game of cosmic dread</title>
<style>
:root{--uw:58px;--uh:78px;--hw:100px;--hh:140px;--side:180px;--serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#04020a;color:#e9e2f3;font-family:system-ui,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{position:fixed;inset:0;display:none;z-index:1;flex-direction:column;align-items:center}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{position:relative;padding:.75em 1.6em;border-radius:.6em;font-family:var(--serif);font-weight:700;letter-spacing:.08em;font-size:15px;color:#f4ecff;background:linear-gradient(180deg,#3d1c6e,#1a0b33);box-shadow:0 0 0 1px #a07ae0 inset,0 0 18px #6a2cff55,0 4px 12px #000a;text-shadow:0 0 8px #b88cff;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.2)}
.btn.ghost{background:#120a20cc;box-shadow:0 0 0 1px #6a5a88 inset}
.btn.sm{padding:.45em .9em;font-size:13px}
.btn[disabled]{opacity:.4;filter:grayscale(1)}
.btn.glow{animation:bglow 1.4s ease-in-out infinite}
@keyframes bglow{50%{box-shadow:0 0 0 1px #e0c0ff inset,0 0 26px #b060ff,0 4px 12px #000a}}
#mute{position:fixed;top:max(6px,env(safe-area-inset-top));right:6px;z-index:60;width:34px;height:34px;border-radius:50%;background:#0d0818cc;box-shadow:0 0 0 1px #5a4a78 inset;display:grid;place-items:center}
#mute svg{width:18px;height:18px;fill:#cdb8f0}
/* title */
#title{justify-content:center}
#teye{position:absolute;left:50%;top:31%;transform:translate(-50%,-50%);pointer-events:none}
.tbox{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:38vh}
body.land .tbox{margin-top:36vh}
body.land #teye{top:25%}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,11vw,92px);letter-spacing:.18em;line-height:.95;color:#efe4ff;text-shadow:0 0 18px #9c5cff,0 0 50px #5a1cff,0 0 4px #fff}
h1 span{display:block;font-size:.55em;letter-spacing:.7em;margin-right:-.7em;color:#c9a8ff}
body.land h1{font-size:clamp(34px,8vh,92px)}
.sub{font-family:var(--serif);font-style:italic;color:#b8a4d8;letter-spacing:.1em;font-size:14px}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:14px;width:min(78vw,300px)}
body.land .menu{flex-direction:row;width:auto;margin-top:6px}
h2{font-family:var(--serif);font-weight:400;letter-spacing:.14em;color:#e8dcff;text-shadow:0 0 12px #8a4cff;font-size:22px;text-align:center;margin:10px 0}
h3{font-family:var(--serif);font-weight:400;letter-spacing:.12em;color:#c8b4e8;font-size:15px;text-align:center;margin:14px 0 8px}
.scroll{width:100%;height:100%;overflow-y:auto;touch-action:pan-y;padding:max(14px,env(safe-area-inset-top)) 14px 24px;display:flex;flex-direction:column;align-items:center}
/* pick */
.tiles{display:grid;grid-template-columns:1fr;gap:10px;width:min(100%,560px)}
body.land .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));width:min(100%,960px)}
.tile{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:linear-gradient(120deg,var(--f1),#0a0612 70%);box-shadow:0 0 0 1px var(--f2) inset;opacity:.75;transition:.2s;text-align:left}
body.land .tile{flex-direction:column;text-align:center}
.tile.on{opacity:1;box-shadow:0 0 0 2px #fff inset,0 0 22px var(--glow)}
.tile .ta{width:74px;height:56px;border-radius:8px;background-size:cover;flex:none;box-shadow:0 0 10px var(--glow)}
body.land .tile .ta{width:100%;height:70px}
.tile b{font-family:var(--serif);font-size:16px;letter-spacing:.06em;display:block}
.tile small{color:#cbbce0;font-size:12px;line-height:1.3;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button{padding:.45em .9em;border-radius:99px;background:#140c22;box-shadow:0 0 0 1px #5a4a78 inset;font-size:13px}
.seg button.on{background:#4a2380;box-shadow:0 0 0 1px #d0b0ff inset,0 0 12px #8a4cff}
.rowb{display:flex;gap:10px;margin-top:18px;justify-content:center}
/* how */
.how{max-width:640px;font-size:14px;line-height:1.5;color:#ddd2ee}
.how p,.how li{margin:6px 0}.how ul{padding-left:18px}.how b{color:#f0e0ff}
.how .kwl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:8px 0}
.ki{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1a1028;box-shadow:0 0 0 1px #8a7aa8 inset}
.ki svg{width:13px;height:13px;fill:#efe2ff}
/* cards */
.card{--cw:var(--hw);position:relative;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.075);font-size:calc(var(--cw)*.075);background:radial-gradient(120% 80% at 50% 0%,var(--f1),var(--f0) 60%,#020104);box-shadow:0 0 0 calc(var(--cw)*.012) var(--f2) inset,0 0 0 calc(var(--cw)*.03) #0008 inset,0 .4em 1em #000b;color:#f4eefb;overflow:hidden;flex:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,#ffffff1c,transparent 35%,transparent 70%,#ffffff10)}
.f-v{--f0:#140624;--f1:#4a1a7e;--f2:#b98cff;--glow:#9a50ff}
.f-m{--f0:#04161c;--f1:#17505f;--f2:#86e8f4;--glow:#30c8dc}
.f-c{--f0:#1e0408;--f1:#741326;--f2:#ff8a80;--glow:#ff3048}
.f-n{--f0:#111318;--f1:#454b55;--f2:#dccb9c;--glow:#c8a860}
.card.f-m{clip-path:polygon(9% 0,91% 0,100% 6.5%,100% 93.5%,91% 100%,9% 100%,0 93.5%,0 6.5%)}
.card.f-m::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#7ff0ff0a 0 1px,transparent 1px 4px);pointer-events:none}
.card.f-c{box-shadow:0 0 0 calc(var(--cw)*.012) var(--f2) inset,0 0 0 calc(var(--cw)*.035) #3a0008 inset,0 0 0 calc(var(--cw)*.045) #ff505040 inset,0 .4em 1em #000b}
.card.f-v{box-shadow:0 0 0 calc(var(--cw)*.012) var(--f2) inset,0 0 calc(var(--cw)*.12) #8a3cff80 inset,0 .4em 1em #000b}
.card .art{position:absolute;left:6%;right:6%;top:4.5%;height:45%;border-radius:.6em .6em .3em .3em;background-size:cover;background-position:center;box-shadow:0 0 0 1px #000a inset,0 0 .9em var(--glow)}
.card.f-v .art{border-radius:50% 50% .4em .4em/30% 30% .4em .4em}
.card.f-c .art{border-radius:.3em}
.card .cost{position:absolute;left:3%;top:2.5%;width:2.3em;height:2.3em;display:grid;place-items:center;font-weight:800;font-size:1.3em;color:#fff;z-index:2;background:radial-gradient(circle at 35% 30%,#d8f4ff,#4aa8ff 35%,#1a2a8a 75%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);text-shadow:0 0 3px #000,0 0 6px #003}
.card .gem{position:absolute;left:50%;top:49.5%;width:1em;height:1em;transform:translate(-50%,-50%) rotate(45deg);z-index:2;box-shadow:0 0 0 1px #000c,0 0 .5em var(--g,#888);background:var(--g,#888)}
.r-C{--g:#a8b0b8}.r-U{--g:#50c8ff}.r-R{--g:#ffc83a}.r-L{--g:conic-gradient(#ff4df0,#6af,#5fffc0,#ffd050,#ff4df0)}.r-T{--g:#555}
.card.r-L .gem{background:conic-gradient(#ff4df0,#6af,#5fffc0,#ffd050,#ff4df0);animation:gemspin 3s linear infinite}
@keyframes gemspin{to{transform:translate(-50%,-50%) rotate(405deg)}}
.card .nm{position:absolute;top:51.5%;left:5%;right:5%;height:1.75em;line-height:1.75em;font-family:var(--serif);font-weight:700;font-size:1.08em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,transparent,#000b 15%,#000b 85%,transparent);letter-spacing:.02em}
.card .ty{position:absolute;top:63.5%;left:0;right:0;text-align:center;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--f2);opacity:.85}
.card .tx{position:absolute;top:69%;left:7%;right:7%;bottom:12%;font-size:.86em;line-height:1.22;text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#e9e0f4}
.card .tx b{color:#fff;font-weight:700}
.card .atk,.card .hp,.unit .atk,.unit .hp{position:absolute;bottom:2.5%;width:2.2em;height:2.2em;display:grid;place-items:center;font-weight:800;font-size:1.15em;color:#fff;text-shadow:0 0 3px #000;z-index:2}
.card .atk,.unit .atk{left:3%;background:radial-gradient(circle at 35% 30%,#ffe0a0,#e08a20 45%,#6a2a00);clip-path:polygon(50% 0,100% 30%,85% 100%,15% 100%,0 30%)}
.card .hp,.unit .hp{right:3%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb0b8,#d0203c 45%,#4a0010)}
.card.spell .tx{bottom:6%}
.card.back{background:radial-gradient(circle,#3a1466,#0b0414 70%)}
.cnt{position:absolute;top:4%;right:5%;z-index:3;font-weight:800;font-size:1.25em;padding:.1em .45em;border-radius:.6em;background:#000c;box-shadow:0 0 0 1px var(--f2) inset}
.cnt.full{color:#ffd76a}
/* match */
#match{display:none;width:100%;max-width:100vw;overflow:hidden;height:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);grid-template-columns:1fr;grid-template-rows:auto 1fr auto 1fr auto auto;grid-template-areas:"oh" "ob" "mid" "mb" "mh" "hand"}
#match.on{display:grid}
body.land #match{grid-template-columns:var(--side) 1fr;grid-template-rows:1fr 1fr auto;grid-template-areas:"oh ob" "mid mb" "mh hand"}
#oph{grid-area:oh}#opb{grid-area:ob}#mid{grid-area:mid}#myb{grid-area:mb}#myh{grid-area:mh}#hand{grid-area:hand}
.board{display:flex;justify-content:center;align-items:center;gap:calc(var(--uw)*.06);min-height:calc(var(--uh) + 16px);padding:8px 4px;position:relative}
.board::before{content:"";position:absolute;left:3%;right:3%;top:50%;height:calc(var(--uh)*1.05);transform:translateY(-50%);border-radius:14px;background:radial-gradient(ellipse at center,#ffffff09,transparent 70%);box-shadow:0 0 0 1px #ffffff0d inset;pointer-events:none}
#myb::before{box-shadow:0 0 0 1px #9a70ff22 inset}
#myb.drop::before{box-shadow:0 0 0 2px #b890ff inset,0 0 24px #8a4cff66 inset}
body.land #opb{padding-right:44px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;min-width:0;grid-template-areas:"av nm st" "av md st";gap:2px 10px;align-items:center;padding:6px 10px;margin:4px 6px;border-radius:14px;background:linear-gradient(90deg,#0c0718e6,#0c071899);box-shadow:0 0 0 1px #ffffff14 inset;position:relative;transition:box-shadow .3s}
#oph{margin-right:46px}
body.land #oph{margin-right:6px}
.hero.act{box-shadow:0 0 0 1px var(--f2) inset,0 0 18px var(--glow)}
body.land .hero{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"av nm" "av md" "st st";align-self:center}
.hero .av{grid-area:av;width:46px;height:46px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px var(--f2),0 0 14px var(--glow)}
.hero .hn{grid-area:nm;font-family:var(--serif);font-size:13px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f0e6ff}
.hero .md{grid-area:md;display:flex;gap:2px;align-items:center}
.hero .md i{width:7px;height:9px;border-radius:2px;background:#2a2238;box-shadow:0 0 0 1px #4a3a60 inset}
.hero .md i.on{background:#c050ff;box-shadow:0 0 6px #d070ff}
.hero .md i.on.hi{background:#ff4df0}
.hero .md span{font-size:10px;color:#b090d8;margin-left:4px;letter-spacing:.06em}
.hero .st{grid-area:st;display:flex;gap:10px;align-items:center;justify-content:flex-end}
body.land .hero .st{justify-content:space-between;margin-top:4px;gap:4px}
body.land .hero{padding:6px 8px}
body.land .san{min-width:36px;height:36px;font-size:16px}
body.land .flux .fx{width:42px}
body.land .hero .md span{display:none}
body.land .cts{font-size:10px}
.san{min-width:40px;height:40px;padding:0 4px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:radial-gradient(circle at 35% 30%,#a8f0ff,#2a80c0 45%,#0a1a40);box-shadow:0 0 12px #3aa0ff88;text-shadow:0 0 4px #000}
.san.low{background:radial-gradient(circle at 35% 30%,#ffc0c8,#c02040 45%,#3a0010);box-shadow:0 0 12px #ff3060aa}
.flux{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:#bfe0ff;line-height:1.1}
.flux .fx{display:flex;flex-wrap:wrap;width:50px;gap:1px;justify-content:center}
.flux .fx i{width:6px;height:6px;transform:rotate(45deg);background:#1a2240;box-shadow:0 0 0 1px #3a4a7a inset}
.flux .fx i.on{background:#6ac0ff;box-shadow:0 0 5px #6ac0ff}
.cts{font-size:11px;color:#bdb0d0;line-height:1.35;text-align:right}
#mid{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px;min-height:44px}
body.land #mid{flex-direction:column;justify-content:center;gap:10px}
#hint{flex:1;min-width:0;font-size:12.5px;color:#cdbbe8;font-style:italic;font-family:var(--serif);letter-spacing:.03em;text-align:left;min-height:1.2em}
body.land #hint{text-align:center;flex:0}
#endt{min-width:112px}
#quit{width:34px;height:34px;border-radius:50%;background:#0d0818cc;box-shadow:0 0 0 1px #5a4a78 inset;font-size:16px;color:#cdb8f0;flex:none}
#hand{position:relative;height:calc(var(--hh) + 20px);overflow:visible;margin:0 4px}
#hand .card{position:absolute;transition:left .25s,top .25s,rotate .25s,translate .18s,scale .18s,box-shadow .2s;transform-origin:50% 100%;cursor:pointer}
#hand .card.can{box-shadow:0 0 0 calc(var(--cw)*.02) #9cffb0,0 0 14px #5aff80aa,0 .4em 1em #000b}
#hand .card.sel{translate:0 calc(var(--hh)*-.22);scale:1.06;z-index:40!important;box-shadow:0 0 0 calc(var(--cw)*.025) #fff,0 0 24px var(--glow),0 .4em 1em #000b}
#hand .card.out{opacity:.25}
#hand .card.drawn{animation:drawIn .55s cubic-bezier(.2,.8,.3,1)}
@keyframes drawIn{from{transform:translate(30vw,-40vh) scale(.25) rotate(25deg);opacity:0}}
.unit{position:relative;width:var(--uw);height:var(--uh);border-radius:14%/10%;flex:none;font-size:calc(var(--uw)*.17);background:var(--f0);box-shadow:0 0 0 2px var(--f2),0 4px 10px #000c;transition:box-shadow .2s,translate .2s,opacity .3s;cursor:pointer}
.unit .art{position:absolute;inset:3px;border-radius:12%/9%;background-size:cover;background-position:center}
.unit.f-m{border-radius:8%}.unit.f-m .art{border-radius:6%}
.unit .atk,.unit .hp{bottom:-.5em;width:1.75em;height:1.75em;font-size:1.05em}
.unit .atk{left:-.3em}.unit .hp{right:-.3em}
.unit .atk.up{color:#9cffb0}.unit .hp.hurt{color:#ffd0d0;background:radial-gradient(circle at 35% 30%,#ff8090,#a00020 45%,#300008)}
.unit .kws{position:absolute;top:4%;right:5%;display:flex;flex-direction:column;gap:2px;z-index:2}
.unit .kws svg{width:1.05em;height:1.05em;padding:.12em;border-radius:50%;background:#000b;fill:#f0e4ff;box-shadow:0 0 0 1px #ffffff40}
.unit.guard{box-shadow:0 0 0 2px var(--f2),0 0 0 calc(2px + var(--uw)*.05) #e8c45a,0 4px 10px #000c;border-radius:14% 14% 40% 40%/10% 10% 22% 22%}
.unit.guard .art{border-radius:12% 12% 38% 38%/9% 9% 20% 20%}
.unit.phase .art{animation:phase 2.6s ease-in-out infinite}
@keyframes phase{50%{opacity:.55;filter:hue-rotate(40deg) blur(.4px)}}
.unit.sleep .art{filter:saturate(.35) brightness(.7)}
.unit.sleep::after{content:"z z";position:absolute;top:-4px;left:6%;font-size:.8em;font-weight:800;color:#b8c8ff;text-shadow:0 0 4px #000;letter-spacing:.1em}
.unit.ready{box-shadow:0 0 0 2px #9cffb0,0 0 14px #5aff80,0 4px 10px #000c}
.unit.guard.ready{box-shadow:0 0 0 2px #9cffb0,0 0 0 calc(2px + var(--uw)*.05) #e8c45a,0 0 16px #5aff80,0 4px 10px #000c}
.unit.sel{translate:0 -8px;box-shadow:0 0 0 3px #fff,0 0 22px var(--glow),0 6px 14px #000c}
.unit.enter{animation:enter .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{transform:scale(1.7) translateY(-20%);opacity:0;filter:brightness(3) blur(3px)}}
.unit.dying{animation:dissolve .75s ease-in forwards;pointer-events:none}
@keyframes dissolve{30%{filter:brightness(2.5) saturate(0) blur(1px)}to{opacity:0;filter:brightness(4) blur(8px) saturate(0);transform:scale(.55) rotate(10deg) translateY(-20%)}}
.unit.hit,.hero.hit{animation:hit .35s}
@keyframes hit{25%{transform:translateX(-4px);filter:brightness(1.8) sepia(1) hue-rotate(-50deg) saturate(4)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.tgt{outline:2px dashed #ff6a88;outline-offset:3px;animation:tg 1s ease-in-out infinite}
@keyframes tg{50%{outline-color:#ffd0dc;outline-offset:6px}}
.ftgt{outline-color:#9cffb0!important}
#match.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.fnum{position:fixed;z-index:80;pointer-events:none;font-weight:900;font-size:26px;text-shadow:0 0 6px #000,0 0 2px #000;transform:translate(-50%,-50%);animation:fnum 1.1s ease-out forwards;white-space:nowrap}
.fnum.s{font-size:15px;letter-spacing:.08em;font-family:var(--serif)}
@keyframes fnum{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.burst{position:fixed;z-index:79;pointer-events:none;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,var(--c,#fff) 0,transparent 65%);mix-blend-mode:screen;animation:burst .6s ease-out forwards}
@keyframes burst{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
#ghost{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-60%) scale(.9) rotate(-4deg);filter:drop-shadow(0 10px 20px #000)}
#arrow{position:fixed;inset:0;width:100%;height:100%;z-index:85;pointer-events:none;display:none}
#banner{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);z-index:70;text-align:center;pointer-events:none;font-family:var(--serif);font-size:clamp(26px,8vw,54px);letter-spacing:.3em;color:#fff;text-shadow:0 0 20px var(--bc,#9a50ff),0 0 50px var(--bc,#9a50ff);opacity:0;padding:14px 0;background:linear-gradient(90deg,transparent,#0008 30%,#0008 70%,transparent)}
#banner.show{animation:banner 1.3s ease-out forwards}
@keyframes banner{0%{opacity:0;letter-spacing:.8em}25%{opacity:1;letter-spacing:.3em}75%{opacity:1}100%{opacity:0;letter-spacing:.2em}}
#preview{position:fixed;left:50%;top:44%;z-index:75;pointer-events:none;transform:translate(-50%,-50%);opacity:0}
#preview .card{--cw:min(200px,46vw,calc(52vh/1.4))}
#preview.show{animation:pv var(--pd,1s) ease-out forwards}
@keyframes pv{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-55%) scale(.92)}}
#zoom{position:fixed;z-index:95;display:none;pointer-events:none}
#zoom.on{display:flex;flex-direction:column;align-items:center;gap:8px}
#zoom.modal{inset:0;background:#000b;justify-content:center;pointer-events:auto;backdrop-filter:blur(3px)}
#zoom .card{--cw:min(250px,62vw,calc(56vh/1.4))}
#zoom .kd{max-width:min(300px,86vw);font-size:12.5px;line-height:1.35;color:#ddd0ee;background:#0c0716ee;padding:8px 10px;border-radius:10px;box-shadow:0 0 0 1px #ffffff20 inset}
#zoom .kd b{color:#fff}#zoom .kd p{margin:2px 0}#zoom .kd i{color:#b8a0d8}

function S(id,n,f,c,r,art,x,fl,o={}){C[id]=Object.assign({id,n,f,t:'s',c,k:[],r,art,x,fl},o);COL.push(id)}

// ---- The Abyss ----
U('v1','Drifting Spawn','v',1,1,1,'','C','tent','','It fell between the stars for a thousand years. It is still falling.',{dread:1});

U('v5','Tendril of the Deep','v',3,3,4,'guard','C','tent','','Only a fingertip of something vast.');
U('v6','Choir of Silence','v',4,3,3,'','U','star','','Their hymn has no sound. Your ears bleed anyway.',{dread:2});
U('v7','Abyssal Maw','v',5,5,5,'','R','maw','When it arrives, deal 2 damage to all other units.','The station had no airlock on that side. It does now.',{play:(g,pi,u)=>{for(const q of units(g))if(q!==u)hurtU(g,q,2,null)}});
U('v8','Dreaming Leviathan','v',7,7,8,'guard','R','tent','','When it wakes, the dream that is our universe ends.',{dread:2});
U('v9','The Unbound Star','v',9,9,9,'phase','L','star','','A sun that remembered it was an eye.',{dread:3});

U('m1','Scrap Drone','m',1,1,2,'salvage','C','drone','','Still running maintenance on a crew long dead.');
U('m2','Hull Sentry','m',2,1,4,'guard','C','drone','','PERIMETER HOLDING. PERIMETER HOLDING. PERIMETER—');
U('m3','Seeker Swarm','m',2,2,1,'swift','U','drone','When it arrives, summon a 1/1 Drone.','They hunt in pairs, then in hundreds.',{play:(g,pi)=>summon(g,pi,'tD')});
U('m4','Med-Bay Unit','m',3,1,4,'','C','drone','When it arrives, restore 3 Sanity and remove 2 Madness.','"Please remain calm. Your screams are being recorded."',{play:(g,pi)=>{healH(g,pi,3);addMad(g,pi,-2)}});
U('m5','Breach Cutter','m',3,3,2,'swift','C','ship','','Built to open hulls. It never stopped.');
U('m6','Lantern Automaton','m',4,3,5,'guard salvage','U','drone','','Its light keeps the dark at bay. Mostly.');
U('m7','Ghost Pilot','m',4,4,3,'phase salvage','U','human','','The ship still flies. Its captain still steers.');
U('m8','Railgun Platform','m',5,3,5,'','R','ship','End of your turn: deal 2 damage to a random enemy unit (or the enemy, if none).','Targeting solution: everything.',{end:(g,pi,u)=>{const e=E(g,pi).board.filter(x=>x.h>0);if(e.length)hurtU(g,pick(e),2,u);else hurtH(g,1-pi,2,u)}});
U('m9','The Ashen Ark','m',8,7,9,'guard','L','ship','When it arrives, summon two 1/1 Drones.','The colony ship arrived 400 years late. Its passengers did not.',{play:(g,pi)=>{summon(g,pi,'tD');summon(g,pi,'tD')}});
S('m10','Overclock','m',1,'C','beam','Give a friendly unit +2 attack. It can attack this turn.','Redline the reactor. Ignore the screaming.',{tg:'friendlyUnit',cast:(g,pi,T)=>{T.u.a+=2;T.u.ready=true}});
S('m11','Ion Lance','m',2,'C','beam','Deal 3 damage to a unit.','Point-defence, repurposed.',{tg:'unit',cast:(g,pi,T)=>hurt(g,T,3)});
S('m12','Emergency Purge','m',4,'U','beam','Deal 2 damage to all enemy units.','Venting compartments 4 through 19.',{cast:(g,pi)=>{for(const q of E(g,pi).board)hurtU(g,q,2,null)}});
S('m13','Reboot Protocol','m',2,'C','rune','Restore 4 Sanity and remove 3 Madness.','Have you tried turning your mind off and on again?',{cast:(g,pi)=>{healH(g,pi,4);addMad(g,pi,-3)}});
// ---- The Red Communion ----
U('c1','Initiate of the Maw','c',1,2,1,'','C','robed','','Eager to give. Eager to be given.');
U('c2','Bloodletter','c',2,2,2,'drain','C','robed','','Every wound is a prayer.');
U('c3','Mutating Acolyte','c',2,1,3,'','U','flesh','At the start of your turn, this gains +1/+1.','Each morning, a little less human. A little more holy.',{start:(g,pi,u)=>{buff(u,1,1);fx(g,{k:'buff',id:'u'+u.uid})}});
U('c4','Spore Carrier','c',2,1,2,'blight','C','flesh','','Breathe deep. Become.');
U('c5','Knife-Priest','c',3,3,3,'offering','U','robed','Offering: +2/+2.','The blade is blessed. The hand is not.',{play:(g,pi,u)=>{if(sacrifice(g,pi,u))buff(u,2,2)}});
U('c6','Flesh Golem','c',4,4,5,'guard','C','flesh','','Assembled from the willing. And the unwilling.');
U('c7','Hierophant of Rot','c',4,3,4,'blight drain','R','robed','','She preaches the gospel of the open wound.');
U('c8','Gorged Abomination','c',5,5,6,'offering','U','maw','Offering: draw 2 cards.','It was a congregation once.',{play:(g,pi,u)=>{if(sacrifice(g,pi,u))draw(g,pi,2)}});
U('c9','The Thousand Mouths','c',8,6,6,'drain','L','maw','When it arrives, sacrifice all your other units. It gains +2/+2 for each.','All voices become one voice. All mouths become one hunger.',{play:(g,pi,u)=>{for(const q of g.p[pi].board)if(q!==u&&q.h>0){destroy(g,q);fx(g,{k:'sac',id:'u'+q.uid});buff(u,2,2)}}});
S('c10','Blood Rite','c',1,'C','rune','Destroy a friendly unit. Draw 2 cards.','The stars only answer those who pay.',{tg:'friendlyUnit',cast:(g,pi,T)=>{destroy(g,T.u);draw(g,pi,2)}});
S('c11','Hemorrhage','c',2,'C','rune','Deal 2 damage to an enemy or enemy unit. Restore 2 Sanity.','Your blood remembers the way out.',{tg:'enemy',cast:(g,pi,T)=>{hurt(g,T,2);healH(g,pi,2)}});

function cardText(d){const k=d.k.filter(k=>k!=='offering'||!/Offering/.test(d.x)).map(k=>k==='dread'?'Dread '+d.dread:KW[k][0]).join(', ');return(k?`<b>${k}.</b> `:'')+(d.x||'').replace(/^Offering:/,'<b>Offering:</b>')}
function prebuilt(f){const cards=[];for(const id of COL){const d=C[id];if(d.f!==f)continue;cards.push(id);if(d.r!=='L')cards.push(id)}cards.push('n2','n2','n3','n3','n4');return{fac:f,name:FAC[f].hero,cards}}
/* ================= RULES ================= */
function fx(g,o){if(!g.sim)g.fx.push(o)}
function units(g){return g.p[0].board.concat(g.p[1].board)}
function findU(g,uid){for(const p of g.p)for(const u of p.board)if(u.uid===uid)return u}
function resolve(g,t){if(!t)return null;if(t[0]==='h')return{k:'h',pi:+t[1]};const u=findU(g,+t.slice(1));return u?{k:'u',pi:u.o,u}:null}
function addMad(g,pi,n){const p=g.p[pi],b=p.mad;p.mad=Math.max(0,Math.min(10,p.mad+n));if(p.mad!==b)fx(g,{k:'mad',pi,n:p.mad-b})}
function healH(g,pi,n){const p=g.p[pi],b=p.san;p.san=Math.min(20,p.san+n);if(p.san>b)fx(g,{k:'heal',id:'h'+pi,n:p.san-b})}
function hurtH(g,pi,n,src){if(n<=0)return;g.p[pi].san-=n;fx(g,{k:'dmg',id:'h'+pi,n});if(src&&src.k.includes('drain'))healH(g,src.o,n)}
function hurtU(g,u,n,src){if(n<=0||u.dead)return;u.h-=n;fx(g,{k:'dmg',id:'u'+u.uid,n});if(src){if(src.k.includes('blight')&&u.h>0){u.h=0;fx(g,{k:'blight',id:'u'+u.uid})}if(src.k.includes('drain'))healH(g,src.o,n)}}
function hurt(g,T,n,src){if(T.k==='h')hurtH(g,T.pi,n,src);else hurtU(g,T.u,n,src)}
function destroy(g,u){u.h=0;u.dead=1}
function buff(u,a,h){u.a+=a;u.h+=h;u.mh+=h}
function draw(g,pi,n=1){const p=g.p[pi];for(let i=0;i<n;i++){if(!p.deck.length){p.fat++;fx(g,{k:'fatigue',pi,n:p.fat});hurtH(g,pi,p.fat);addMad(g,pi,1);continue}const id=p.deck.pop();if(p.hand.length>=10){fx(g,{k:'burn',pi,cid:id});continue}p.hand.push({uid:g.uid++,id});fx(g,{k:'draw',pi})}}
function mkUnit(g,pi,id,uid){const d=C[id];return{uid:uid??g.uid++,id,o:pi,a:d.a,h:d.h,mh:d.h,k:d.k.slice(),ready:d.k.includes('swift'),atk:0,dead:0}}
function summon(g,pi,id){const p=g.p[pi];if(p.board.length>=6)return null;const u=mkUnit(g,pi,id);p.board.push(u);fx(g,{k:'summon',id:'u'+u.uid});return u}
function sacrifice(g,pi,ex){const b=g.p[pi].board.filter(u=>u!==ex&&u.h>0);if(!b.length)return null;b.sort((x,y)=>(x.a+x.h)-(y.a+y.h));destroy(g,b[0]);fx(g,{k:'sac',id:'u'+b[0].uid});return b[0]}
function cleanup(g){for(let n=0;n<30;n++){let any=false;for(let pi=0;pi<2;pi++){const p=g.p[pi],dead=p.board.filter(u=>u.h<=0);if(!dead.length)continue;any=true;p.board=p.board.filter(u=>u.h>0);for(const u of dead){u.dead=1;fx(g,{k:'die',id:'u'+u.uid});if(u.k.includes('salvage'))draw(g,pi,1);const d=C[u.id];if(d.death)d.death(g,pi,u)}}if(!any)break}checkWin(g)}
function checkWin(g){if(g.over)return;const l=g.p.map(p=>p.san<=0||p.mad>=10);if(l[0]||l[1]){g.over=true;g.winner=l[0]&&l[1]?-1:l[0]?1:0;const lp=g.p[l[0]?0:1];g.reason=lp.mad>=10?'mad':'san'}}
function spellTargets(g,pi,tg){const r=[],add=pj=>{for(const u of g.p[pj].board)r.push('u'+u.uid)};

function canAtk(u){return u.ready&&!u.atk&&u.a>0&&u.h>0}
function atkTargets(g,pi,u){const ph=u.k.includes('phase');const e=E(g,pi).board.filter(t=>ph||!t.k.includes('phase'));const gd=e.filter(t=>t.k.includes('guard'));if(!ph&&gd.length)return gd.map(t=>'u'+t.uid);return e.map(t=>'u'+t.uid).concat('h'+(1-pi))}
function canPlay(g,pi,c){const p=g.p[pi],d=C[c.id];if(g.over||g.cur!==pi||d.c>p.flux)return false;if(d.t==='u')return p.board.length<6;if(d.tg)return spellTargets(g,pi,d.tg).length>0;return true}

function legal(g,pi){const p=g.p[pi],A=[];if(g.over||g.cur!==pi)return A;
 for(const c of p.hand){const d=C[c.id];if(!canPlay(g,pi,c))continue;if(d.tg)for(const T of spellTargets(g,pi,d.tg))A.push({t:'play',uid:c.uid,tg:T});else A.push({t:'play',uid:c.uid})}

function unitV(u){const d=C[u.id];let v=1+u.a*1.1+Math.max(u.h,0)*.9;for(const k of u.k){v+=KWV[k]||0;if(k==='drain')v+=u.a*.4}if(d.start||d.end)v+=1.8;return v}
